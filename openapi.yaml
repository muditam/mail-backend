openapi: 3.0.3
info:
  title: 60Brands Webmail BFF
  version: 0.1.0
servers:
  - url: /api/app/v1
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: webmail_sid
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
    Safety:
      type: object
      required: [classification, fromDomain]
      properties:
        classification: {type: string, enum: [internal, external, suspicious]}
        fromDomain: {type: string, nullable: true}
    MessageSummary:
      type: object
      required: [id, safety]
      properties:
        id: {type: string}
        safety: {$ref: '#/components/schemas/Safety'}
    DraftPayload:
      type: object
      required: [to, subject, bodyText, attachmentIds]
      properties:
        draftId: {type: string}
        to: {type: array, items: {type: string, format: email}}
        cc: {type: array, items: {type: string, format: email}}
        bcc: {type: array, items: {type: string, format: email}}
        subject: {type: string}
        bodyText: {type: string}
        attachmentIds: {type: array, items: {type: string}}
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      security: []
      summary: Authenticate mailbox user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200': {description: 'Session with user and CSRF token'}
        '401': {description: Invalid credentials}
  /auth/session:
    get:
      summary: Restore session
      responses:
        '200': {description: 'User and rotated CSRF token'}
        '401': {description: Session expired}
  /auth/logout:
    post:
      summary: End session
      parameters: [{in: header, name: X-CSRF-Token, required: true, schema: {type: string}}]
      responses:
        '204': {description: Logged out}
  /mailboxes:
    get:
      summary: List current user mailboxes
      responses:
        '200': {description: 'mailboxes array'}
  /messages:
    get:
      summary: List or search messages in newest-first order
      description: Supply starred=true for flagged mail across folders, mailboxId to browse a folder, or q to search sender, subject and body across the account. Supplying both restricts search to that folder. Search is limited to 20 requests per session per minute.
      parameters:
        - {in: query, name: mailboxId, schema: {type: string}}
        - {in: query, name: starred, schema: {type: string, enum: ['true']}, description: Return only starred messages; can combine with mailboxId and q}
        - {in: query, name: q, schema: {type: string, minLength: 1, maxLength: 256}, description: Search terms; whitespace-only queries are rejected}
        - {in: query, name: cursor, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Messages with backend-derived safety and optional nextCursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: {type: array, items: {$ref: '#/components/schemas/MessageSummary'}}
                  nextCursor: {type: string}
  /messages/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: string}}]
    get:
      summary: Get message with plain-text body and attachment metadata
      responses:
        '200':
          description: Message with bodyText, attachments and backend-derived safety
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {$ref: '#/components/schemas/MessageSummary'}
    patch:
      summary: Set read status
      parameters: [{in: header, name: X-CSRF-Token, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [isRead], properties: {isRead: {type: boolean}}}
      responses:
        '200': {description: 'message id and isRead'}
  /messages/send:
    post:
      summary: Submit a message
      parameters: [{in: header, name: X-CSRF-Token, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftPayload'}
      responses:
        '202': {description: 'submissionId and queued status'}
  /attachments:
    post:
      summary: Upload an attachment
      parameters: [{in: header, name: X-CSRF-Token, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses:
        '201': {description: 'attachment metadata'}
  /attachments/{id}:
    get:
      summary: Download an authorized attachment
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: File bytes}
  /drafts:
    post:
      summary: Create or replace draft
      parameters: [{in: header, name: X-CSRF-Token, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftPayload'}
      responses:
        '200': {description: draftId}
  /drafts/{id}:
    delete:
      summary: Delete draft
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      responses:
        '204': {description: Draft deleted}
  /messages/{id}/report:
    parameters: [{in: path, name: id, required: true, schema: {type: string}}]
    post:
      summary: Report server-fetched message metadata to the configured IT recipient
      description: Requires same-origin session and CSRF. No original body, preview, attachments or raw headers are forwarded. Missing configuration and upstream failures never return success.
      parameters: [{in: header, name: X-CSRF-Token, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202':
          description: Accepted by the mail server for delivery (not a delivery receipt)
          content:
            application/json:
              schema:
                type: object
                required: [status, submissionId]
                properties:
                  status: {type: string, enum: [queued]}
                  submissionId: {type: string}
        '400': {description: Invalid payload}
        '401': {description: Session expired}
        '403': {description: Origin or CSRF validation failed}
        '404': {description: Message unavailable in this account}
        '429': {description: Report rate limit exceeded}
        '503': {description: Reporting unavailable or submission status unknown}
  /messages/{id}/move:
    post:
      summary: Move a message to Trash or restore it
      description: Restore moves drafts to Drafts and other messages to Inbox. Content and keywords are preserved. Repeated operations are harmless. Requires session, same-origin request and CSRF token.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: {type: string, enum: [trash, restore]}
      responses:
        '200': {description: 'message containing id and resulting mailboxIds'}
        '400': {description: Invalid action or payload}
        '401': {description: Session expired}
        '403': {description: Origin or CSRF check failed}
        '404': {description: Message or destination folder unavailable}
        '429': {description: Move rate limit exceeded}
        '503': {description: Move could not be confirmed; refresh before retrying}
  /messages/{id}/star:
    patch:
      summary: Set or clear a message star
      description: Updates only the JMAP $flagged keyword in the signed-in account. Repeating the same request is harmless.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isStarred]
              properties:
                isStarred: {type: boolean}
      responses:
        '200': {description: 'message containing id and isStarred; lists and details expose keywords.$flagged'}
        '400': {description: Invalid payload}
        '401': {description: Session expired}
        '403': {description: Origin or CSRF check failed}
        '404': {description: Message unavailable in this account}
        '429': {description: Too many star updates}
        '503': {description: Update could not be confirmed}
